<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <form action="">
        <div class="calculator">
            <div class="calc_header">
                <input    maxlength="20"   type="text"  name="display" class="displayinput">

            </div>
            <div class="calc_body">
                <input type="button" value="AC" class="gary" onclick="display.value=''" > 
                <input type="button" value="DEL" class="gary"  onclick="display.value =display.value.toString().slice(0, -1)">
                <input type="button" value="." class="gary" onclick="display.value += '.'">
                <input type="button" value="/" class="orange" onclick="display.value += '/'">
                <input type="button" value="7" onclick="display.value += '7'">
                <input type="button" value="8" onclick="display.value += '8'">
                <input type="button" value="9" onclick="display.value += '9'">
                <input type="button" value="*" class="orange" onclick="display.value += '*'">
                <input type="button" value="4" onclick="display.value += '4'">
                <input type="button" value="5" onclick="display.value += '5'">
                <input type="button" value="6" onclick="display.value += '6'">
                <input type="button" value="-" class="orange" onclick="display.value += '-'">
                <input type="button" value="1" onclick="display.value += '1'">
                <input type="button" value="2" onclick="display.value += '2'">
                <input type="button" value="3" onclick="display.value += '3'">
                <input type="button" value="+" class="orange" onclick="display.value += '+'">
                <input type="button" value="00" class="dbl" onclick="display.value += '00'">
                <input type="button" value="0" onclick="display.value += '00'">
                <input type="button" value="=" class="orange" onclick="display.value= eval(display.value)">


            </div>
        </div>
    </form>

</body>

</html>
